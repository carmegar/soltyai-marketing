name: guardrails

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sin dependencias a propósito: el linter tiene que correr en segundos y no puede
      # romperse por un npm install. Si algún día necesita una librería, revisar esa decisión.
      #
      # Ese "a propósito" era un comentario, y un comentario no es una guarda: el día que
      # alguien agregara un paquete, nada avisaba — el CI no instala, así que el import
      # reventaría en ejecución, sin lockfile y sin revisión. Ahora es un chequeo, y va
      # PRIMERO porque si se rompió, lo de abajo no significa nada.
      - name: Cero dependencias (o lockfile, si dejaron de ser cero)
        run: node src/sin-dependencias.js

      - name: El linter muerde
        run: node src/guardrails/prueba.js

      - name: Guardrails de mensaje
        run: node src/guardrails/index.js

      - name: Catálogo y márgenes
        run: node src/catalogo/index.js validar

      # Faltaba: `npm run check` corre cinco cosas y este workflow corría cuatro. Mientras
      # `data/semanas.json` estuvo vacío daba igual, pero con la ronda cargada esta validación
      # es la que caza un origin sin registrar o una semana con cierres y sin gasto. Se agrega
      # ahora, antes de que haya datos, que es cuando arreglarlo es gratis.
      - name: Consistencia de los reportes
        run: node src/reportes/index.js validar
